# Builds with Vite and pushes ./dist to the gh-pages branch.
#
# Required once in the repo: Settings → Pages → Build and deployment → Source:
# "Deploy from a branch" → Branch "gh-pages" → Folder "/ (root)" → Save.
# (If Source was "Deploy from a branch" with "main" / root, the site served the
# raw index.html with /src/main.js — no bundle, no CSS — which looks "broken".)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
